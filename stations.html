<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Stations — Eclipse</title>
  <meta name="description" content="Find EV charging stations near you — Eclipse" />

  <!-- NAV -->

          <a href="stations.html">Stations</a>
          <a href="booking.html">Booking</a>
          <a href="bookings.html">My Bookings</a>
        </div>
      </div>

      <div class="nav__right">
        <a href="bookings.html" class="nav__icon-link">MY BOOKINGS</a>
        <a href="index.html" class="btn-login">HOME</a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="stations-page">

    <!-- SEARCH HEADER -->
    <section class="search-header" id="searchHeader">
      <h1 class="search-header__title">FIND CHARGING STATIONS</h1>
      <div class="search-header__bar">
        <svg class="search-header__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" class="search-header__input" id="searchInput" placeholder="Search by station name, city, or state..." aria-label="Search stations" />
        <button class="search-header__btn" id="searchBtn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- FILTERS -->
    <section class="filters" id="filtersSection">
      <div class="filters__row">
        <div class="filter-group">
          <label class="filter-label" for="filterState">State</label>
          <select class="filter-select" id="filterState">
            <option value="">All States</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterCity">City</label>
          <select class="filter-select" id="filterCity">
            <option value="">All Cities</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterCharger">Charger Type</label>
          <select class="filter-select" id="filterCharger">
            <option value="">All Types</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterAvailable">Availability</label>
          <select class="filter-select" id="filterAvailable">
            <option value="">All</option>
            <option value="true">Available Now</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterSort">Sort By</label>
          <select class="filter-select" id="filterSort">
            <option value="">Default</option>
            <option value="name">Name (A-Z)</option>
            <option value="name_desc">Name (Z-A)</option>
            <option value="price">Price (Low-High)</option>
            <option value="price_desc">Price (High-Low)</option>
            <option value="power">Power (Highest)</option>
            <option value="city">City</option>
          </select>
        </div>
        <button class="filter-clear" id="clearFilters">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
          Clear
        </button>
      </div>
    </section>

    <!-- RESULTS HEADER -->
    <section class="results-header" id="resultsHeader">
      <p class="results-header__count" id="resultCount">Loading stations...</p>
      <div class="results-header__chips" id="activeChips"></div>
    </section>

    <!-- CONTENT: CARDS -->
    <section class="results-layout">
      <div class="results-grid" id="resultsGrid">
        <!-- Station cards rendered by JS -->
      </div>
    </section>

    <!-- PAGINATION -->
    <section class="pagination" id="pagination"></section>

    <!-- EMPTY STATE -->
    <section class="state-empty" id="emptyState" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(161,254,160,0.4)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        <path d="M8 11h6"/>
      </svg>
      <h2 class="state-empty__title">No stations found</h2>
      <p class="state-empty__text">Try adjusting your search or clearing filters.</p>
      <button class="state-empty__btn" id="emptyResetBtn">Clear all filters</button>
    </section>

    <!-- ERROR STATE -->
    <section class="state-error" id="errorState" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255,100,100,0.5)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4M12 16h.01"/>
      </svg>
      <h2 class="state-error__title">Something went wrong</h2>
      <p class="state-error__text">We couldn't load charging stations. Try again.</p>
      <button class="state-error__btn" id="errorRetryBtn">Retry</button>
    </section>

  </main>

  <script src="script.js"></script>
  <script src="stations.js"></script>
</body>
</html>
